# PluEssentials configuration

# Prefix used in plugin messages
prefix: "&7[&bPluEssentials&7] "

# Web Admin Panel
web:
  enabled: true
  # Host to bind (0.0.0.0 = all interfaces)
  host: "0.0.0.0"
  port: 8080
  # Admin login password. CHANGE THIS in production!
  password: "admin123"
  # Session token expiry in minutes
  token-expiry: 60
  # Max console lines kept in memory
  console-buffer: 500
  # Optional: serve frontend from external directory (e.g. built Vue dist).
  # Leave empty to use the embedded panel.
  external-web-dir: ""

# Database storage (MySQL). If disabled, YAML files are used.
database:
  enabled: false
  host: "localhost"
  port: 3306
  database: "pluessentials"
  username: "root"
  password: ""
  # Tables are created automatically on first run
  table-prefix: "plu_"

# Spawn configuration
spawn:
  # If no spawn is set, uses the world's spawn point
  use-world-spawn: true

# Whitelist
whitelist:
  enabled: false

# Home limits by permission (plu.home.limit.<name>)
# The value "default" is used when no specific limit permission is set.
home:
  default-limit: 5
  # Example: a player with plu.home.limit.vip gets 20 homes
  limits:
    vip: 20
    admin: 50

# TPA request timeout in seconds
tpa:
  timeout: 60

# /back feature
back:
  enabled: true
  # Message shown after death
  death-message: "&cYou died! Use &e/back &cto return to your death point."

# Kits configuration
# Each kit has a list of items (material, amount, optionally name/lore)
# and a cooldown in seconds (0 = no cooldown)
kits:
  starter:
    cooldown: 0
    items:
      - material: STONE_SWORD
        amount: 1
      - material: STONE_PICKAXE
        amount: 1
      - material: COOKED_BEEF
        amount: 16
  vip:
    cooldown: 3600
    items:
      - material: DIAMOND_SWORD
        amount: 1
      - material: GOLDEN_APPLE
        amount: 8

# 玩家市场
market:
  # 成交税率（百分比，0 = 免税）
  tax-percent: 0
  # 每人最多上架数量
  max-items-per-player: 10

# 内置经济系统（不依赖 Vault 或任何经济插件）
economy:
  enabled: true
  # 货币名称与符号，用于消息与网页展示
  currency-name: "金币"
  currency-symbol: ""
  # 小数位数（0-4）
  decimals: 2
  # 玩家首次进服发放的初始余额（0 = 不发放）
  starting-balance: 100

# 领地
claims:
  # 每人最多领地数量
  max-per-player: 2
  # 单块领地最大半径（边长 = 2*半径+1）
  max-radius: 16

# 自定义 TAB 列表
tab:
  enabled: true
  header: "&b&lPluEssentials &7| &f在线 &a{online}&7/&a{max}"
  footer: "&7世界: &a{world} &7| 余额: &a{balance} &7| 时间: &a{time}"

# 登录系统（注册 + 登录）
login:
  enabled: true

# 中文昵称（只影响显示，不改变真实登录名）
nickname:
  enabled: true
  # 昵称最大长度（按字符数，中文算 1 个）
  max-length: 16

# 兼容性
compat:
  # 是否允许非 ASCII（中文）游戏名。原版客户端仍只允许英文名，
  # 中文 ID 需要改版客户端或代理；开启后本插件不会主动拒绝这类玩家。
  allow-non-ascii-names: true

# 自定义菜单（menus.yml）
menus:
  enabled: true

# NPC
npcs:
  enabled: true
  # 已安装 Citizens 时，是否所有 NPC 都交给 Citizens 生成（true 可支持皮肤）
  # 设为 false 时，只有 type=player 的 NPC 会尝试 Citizens
  use-citizens: false

# 命令告示牌
cmdsigns:
  enabled: true
  # 创建时是否自动改写告示牌前三行作为标识
  write-label: true

# 充值系统（微信支付 APIv3 JSAPI 公众号支付）
wechatpay:
  # 总开关。未开启时 /charge 与充值页不可用
  enabled: false
  # 模拟支付：true 时跳过微信，直接确认发货，用于测试流程
  # 凭据不完整时也会自动降级为模拟支付
  mock: true
  app-id: ""
  app-secret: ""
  mch-id: ""
  # 商户 API 证书序列号
  cert-serial-no: ""
  # 商户私钥（PKCS#8 PEM，相对路径基于插件数据目录）
  private-key-path: "apiclient_key.pem"
  # APIv3 密钥（32 位）
  api-v3-key: ""
  # 微信支付回调地址，例如 https://mc.example.com/api/pay/notify
  notify-url: ""
  # 玩家可访问的站点地址，用于生成 /pay 与 OAuth 回调
  # 留空时使用 http://127.0.0.1:端口
  public-base-url: ""
  # 微信支付平台证书（配置后会校验回调签名，生产环境建议配置）
  platform-cert-path: ""
  description: "Minecraft 服务器充值"

recharge:
  # 单笔金额限制（分）
  min-fen: 1
  max-fen: 1000000
